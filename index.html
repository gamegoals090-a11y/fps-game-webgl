<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FPS Arena - 2000m²</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(#87ceeb, #dfefff);
    }
    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 16px;
      height: 16px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
    }
    #crosshair::before, #crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 0 6px rgba(0,0,0,0.5);
    }
    #crosshair::before {
      left: 7px; top: 0; width: 2px; height: 16px;
    }
    #crosshair::after {
      left: 0; top: 7px; width: 16px; height: 2px;
    }
    #hud {
      position: fixed;
      left: 24px;
      top: 24px;
      color: #00ff00;
      font-size: 14px;
      background: rgba(0,0,0,0.5);
      padding: 12px 16px;
      border-radius: 8px;
      border: 2px solid #00ff00;
      z-index: 11;
      font-weight: bold;
      letter-spacing: 0.5px;
      font-family: 'Courier New', monospace;
      line-height: 1.6;
    }
    #hud div {
      margin: 4px 0;
    }
    #minimap {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: 200px;
      height: 200px;
      background: rgba(0, 20, 0, 0.8);
      border: 2px solid #00ff00;
      border-radius: 4px;
      z-index: 11;
    }
  </style>
</head>
<body>
  <div id="crosshair"></div>
  <div id="hud">
    <div>⚔ FPS ARENA 2000m²</div>
    <div id="ammo">💣 Ammo: 300</div>
    <div id="health">❤ Health: 100</div>
    <div id="pos">📍 Pos: 0, 0, 0</div>
    <div style="margin-top: 8px; font-size: 12px; color: #00aa00;">
      WASD/↑↓←→ Hareket<br>
      Sol Tık: Ateş<br>
      Space: Zıpla<br>
      E: Kilit Aç/Kapat
    </div>
  </div>
  <canvas id="gameCanvas"></canvas>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
    import { PointerLockControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/PointerLockControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9fd3ff);
    scene.fog = new THREE.Fog(0x9fd3ff, 150, 500);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.7, 15);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new PointerLockControls(camera, document.body);
    scene.add(controls.getObject());

    const clock = new THREE.Clock();

    // ---- WORLD SETUP ----
    const world = new THREE.Group();
    scene.add(world);

    const ambient = new THREE.HemisphereLight(0xffffff, 0x4a5b5a, 1.1);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xffffff, 1.2);
    sun.position.set(100, 80, 100);
    sun.castShadow = true;
    sun.shadow.mapSize.set(4096, 4096);
    sun.shadow.camera.far = 500;
    sun.shadow.camera.left = -250;
    sun.shadow.camera.right = 250;
    sun.shadow.camera.top = 250;
    sun.shadow.camera.bottom = -250;
    scene.add(sun);

    // 2000m² ARENA = 44.7m x 44.7m
    const ARENA_SIZE = 44.7;
    
    // GROUND - çok geniş
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(ARENA_SIZE * 2, ARENA_SIZE * 2),
      new THREE.MeshStandardMaterial({ 
        color: 0x7aa86c, 
        roughness: 1,
        map: createCheckerboardTexture()
      })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    world.add(ground);

    // Collision system
    const colliders = [];
    const breakables = [];
    const gameState = {
      ammo: 300,
      health: 100,
      velocity: new THREE.Vector3(0, 0, 0),
      grounded: false,
      canJump: true
    };

    function createCheckerboardTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      const size = 8;
      for (let i = 0; i < 8; i++) {
        for (let j = 0; j < 8; j++) {
          ctx.fillStyle = (i + j) % 2 === 0 ? '#8bc88e' : '#6fa875';
          ctx.fillRect(i * size, j * size, size, size);
        }
      }
      return new THREE.CanvasTexture(canvas);
    }

    function addCollider(mesh, halfExtentX, halfExtentY, halfExtentZ, isBreakable = false) {
      colliders.push({
        x: mesh.position.x,
        y: mesh.position.y,
        z: mesh.position.z,
        w: halfExtentX,
        h: halfExtentY,
        d: halfExtentZ,
        mesh,
        isBreakable
      });
      if (isBreakable) breakables.push(mesh);
    }

    function addBox(x, y, z, w, h, d, color = 0x8b8f97, isBreakable = false) {
      const mat = new THREE.MeshStandardMaterial({ 
        color, 
        roughness: 0.9, 
        metalness: isBreakable ? 0.2 : 0.3 
      });
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      world.add(mesh);

      if (isBreakable) {
        mesh.userData.health = 2;
        mesh.material.transparent = true;
        mesh.material.opacity = 0.65;
      }

      addCollider(mesh, w / 2, h / 2, d / 2, isBreakable);
      return mesh;
    }

    function addCylinder(x, y, z, radius, height, color = 0x8b8f97, isBreakable = false) {
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.9 });
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, height, 16), mat);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      world.add(mesh);
      
      if (isBreakable) {
        mesh.userData.health = 1;
        mesh.material.transparent = true;
        mesh.material.opacity = 0.6;
      }

      // Silindir collider (yaklaşık box olarak)
      addCollider(mesh, radius * 0.8, height / 2, radius * 0.8, isBreakable);
      return mesh;
    }

    // ARENA SINIRLARI - yüksek duvarlar
    const wallColor = 0x5a5a5a;
    addBox(0, 4, -ARENA_SIZE/2 - 1, ARENA_SIZE + 4, 8, 2, wallColor);
    addBox(0, 4, ARENA_SIZE/2 + 1, ARENA_SIZE + 4, 8, 2, wallColor);
    addBox(-ARENA_SIZE/2 - 1, 4, 0, 2, 8, ARENA_SIZE + 4, wallColor);
    addBox(ARENA_SIZE/2 + 1, 4, 0, 2, 8, ARENA_SIZE + 4, wallColor);

    // KÖŞE KULELERI
    const towerPositions = [
      [-ARENA_SIZE/2.5, -ARENA_SIZE/2.5],
      [ARENA_SIZE/2.5, -ARENA_SIZE/2.5],
      [-ARENA_SIZE/2.5, ARENA_SIZE/2.5],
      [ARENA_SIZE/2.5, ARENA_SIZE/2.5]
    ];

    for (const [px, pz] of towerPositions) {
      addCylinder(px, 3.5, pz, 2.5, 7, 0x6d5c42);
      addBox(px, 5, pz, 3, 1, 3, 0x7c6452); // çatı
    }

    // MERDİVENLER/PLATFORMLAR
    for (let i = 0; i < 5; i++) {
      addBox(15 + i * 1.5, 0.8 + i * 0.6, 0, 2.5, 0.8, 3, 0x9b9b9b);
    }

    for (let i = 0; i < 5; i++) {
      addBox(-15 - i * 1.5, 0.8 + i * 0.6, 0, 2.5, 0.8, 3, 0x9b9b9b);
    }

    // KIRILABİLİR CAMLAR - arena içinde dağınık
    const glassPositions = [
      [-10, 2.5, -10], [-5, 2.5, -12], [0, 2.5, -14], [5, 2.5, -12], [10, 2.5, -10],
      [-12, 2.5, 0], [-14, 2.5, 5], [-12, 2.5, 10],
      [12, 2.5, -8], [14, 2.5, 2], [12, 2.5, 8],
      [0, 2.5, 10], [-8, 2.5, 12], [8, 2.5, 12]
    ];

    for (const [x, y, z] of glassPositions) {
      const glass = addBox(x, y, z, 2.5, 3, 0.3, 0x9ae8ff, true);
      glass.material.color.set(0x7ed7ff);
      glass.material.emissive = new THREE.Color(0x1b82ff);
      glass.material.emissiveIntensity = 0.15;
    }

    // SİPERLER - Engeller
    const covers = [
      [-8, -8], [8, -8], [-8, 8], [8, 8],
      [0, -12], [0, 12], [-12, 0], [12, 0]
    ];

    for (const [x, z] of covers) {
      addBox(x, 1, z, 3.5, 2.5, 3.5, 0x7c5c42);
    }

    // ORTA SİPER
    addBox(0, 1.5, 0, 6, 3, 6, 0x8b7355);

    // AĞAÇLAR - dekorasyon + engel
    for (let i = 0; i < 25; i++) {
      const angle = (i / 25) * Math.PI * 2;
      const dist = 35 + Math.random() * 5;
      const x = Math.cos(angle) * dist;
      const z = Math.sin(angle) * dist;
      
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.3, 0.4, 2.5, 8),
        new THREE.MeshStandardMaterial({ color: 0x5b3c26, roughness: 1 })
      );
      trunk.position.set(x, 1.25, z);
      trunk.castShadow = true;
      world.add(trunk);

      const crown = new THREE.Mesh(
        new THREE.SphereGeometry(1.5, 12, 12),
        new THREE.MeshStandardMaterial({ color: 0x2a8b4a, roughness: 0.9 })
      );
      crown.position.set(x, 3.5, z);
      crown.castShadow = true;
      world.add(crown);

      addCollider(trunk, 0.4, 1.25, 0.4);
    }

    // --- SILAH MODELİ (M4A4) ---
    const gun = new THREE.Group();
    camera.add(gun);
    scene.add(camera);

    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1e1e1e, roughness: 0.6, metalness: 0.8 });
    const metalMat = new THREE.MeshStandardMaterial({ color: 0x3f3f3f, roughness: 0.4, metalness: 0.95 });

    const receiver = new THREE.Mesh(new THREE.BoxGeometry(1, 0.25, 0.2), bodyMat);
    receiver.position.set(0.6, -0.4, -0.85);
    gun.add(receiver);

    const stock = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.15, 0.15), metalMat);
    stock.position.set(0.05, -0.45, -0.85);
    gun.add(stock);

    const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 1.3, 12), metalMat);
    barrel.rotation.z = Math.PI / 2;
    barrel.position.set(1.2, -0.4, -0.85);
    gun.add(barrel);

    const grip = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.55, 0.13), bodyMat);
    grip.position.set(0.45, -0.75, -0.85);
    grip.rotation.z = 0.18;
    gun.add(grip);

    const magazine = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.5, 0.12), bodyMat);
    magazine.position.set(0.48, -0.85, -0.85);
    magazine.rotation.z = 0.15;
    gun.add(magazine);

    gun.position.set(0.3, -0.15, -1.2);

    // Controls & Input
    const keys = {};
    let isLocked = false;

    document.addEventListener("keydown", (e) => {
      keys[e.code] = true;
      if (e.code === "KeyE") {
        if (isLocked) controls.unlock();
        else controls.lock();
      }
      if (e.code === "Space" && gameState.canJump && gameState.grounded) {
        gameState.velocity.y = 8;
        gameState.grounded = false;
        gameState.canJump = false;
      }
    });

    document.addEventListener("keyup", (e) => {
      keys[e.code] = false;
    });

    document.addEventListener("pointerlockchange", () => {
      isLocked = document.pointerLockElement === document.body;
    });

    document.body.addEventListener("click", () => {
      if (!isLocked) controls.lock();
      else shoot();
    });

    // Collision detection
    function collides(pos, radius = 0.65) {
      for (const c of colliders) {
        const dx = Math.abs(pos.x - c.x);
        const dz = Math.abs(pos.z - c.z);
        const dy = Math.abs(pos.y - c.y);

        if (dx < (radius + c.w) && dz < (radius + c.d) && dy < (1.8 + c.h)) {
          return c;
        }
      }
      return null;
    }

    // Movement with gravity & jump
    function updateMovement(delta) {
      const speed = 14;
      const gravity = -22;

      const forward = new THREE.Vector3();
      camera.getWorldDirection(forward);
      forward.y = 0;
      forward.normalize();

      const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();
      const moveDir = new THREE.Vector3();

      if (keys["KeyW"]) moveDir.add(forward);
      if (keys["KeyS"]) moveDir.sub(forward);
      if (keys["KeyA"]) moveDir.sub(right);
      if (keys["KeyD"]) moveDir.add(right);

      if (moveDir.length() > 0) {
        moveDir.normalize();
        const next = controls.getObject().position.clone();
        next.x += moveDir.x * speed * delta;
        next.z += moveDir.z * speed * delta;

        if (!collides(next)) {
          controls.getObject().position.x = next.x;
          controls.getObject().position.z = next.z;
        }
      }

      // Gravity
      gameState.velocity.y += gravity * delta;
      const nextY = controls.getObject().position.y + gameState.velocity.y * delta;

      if (nextY < 1.7) {
        controls.getObject().position.y = 1.7;
        gameState.velocity.y = 0;
        gameState.grounded = true;
        gameState.canJump = true;
      } else {
        controls.getObject().position.y = nextY;
        gameState.grounded = false;
      }

      // Arena boundary check
      const pos = controls.getObject().position;
      const limit = ARENA_SIZE / 2 - 2;
      if (Math.abs(pos.x) > limit) pos.x = Math.sign(pos.x) * limit;
      if (Math.abs(pos.z) > limit) pos.z = Math.sign(pos.z) * limit;
    }

    // Shooting system
    const raycaster = new THREE.Raycaster();
    const muzzleFlash = new THREE.Mesh(
      new THREE.SphereGeometry(0.12, 12, 12),
      new THREE.MeshBasicMaterial({ color: 0xff8800 })
    );
    muzzleFlash.visible = false;
    scene.add(muzzleFlash);

    function shoot() {
      if (gameState.ammo <= 0) return;
      gameState.ammo--;

      const dir = new THREE.Vector3();
      camera.getWorldDirection(dir);
      dir.x += (Math.random() - 0.5) * 0.05;
      dir.y += (Math.random() - 0.5) * 0.05;
      dir.z += (Math.random() - 0.5) * 0.05;

      raycaster.set(camera.position, dir);
      const hits = raycaster.intersectObjects(breakables);

      for (const hit of hits) {
        if (hit.object.userData.health !== undefined) {
          hit.object.userData.health--;
          if (hit.object.userData.health <= 0) {
            hit.object.visible = false;
            const idx = breakables.indexOf(hit.object);
            if (idx !== -1) breakables.splice(idx, 1);
          }
          break;
        }
      }

      // Muzzle flash
      muzzleFlash.visible = true;
      muzzleFlash.position.copy(camera.position).add(dir.clone().multiplyScalar(1.5));
      setTimeout(() => { muzzleFlash.visible = false; }, 50);
    }

    // HUD Update
    function updateHUD() {
      const pos = controls.getObject().position;
      document.getElementById("ammo").textContent = `💣 Ammo: ${gameState.ammo}`;
      document.getElementById("health").textContent = `❤ Health: ${gameState.health}`;
      document.getElementById("pos").textContent = 
        `📍 Pos: ${pos.x.toFixed(1)}, ${(pos.y - 1.7).toFixed(1)}, ${pos.z.toFixed(1)}`;
    }

    // Main render loop
    function animate() {
      const delta = Math.min(clock.getDelta(), 0.016);
      updateMovement(delta);
      updateHUD();

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Initial lock prompt
    console.log("Oyunu başlatmak için ekrana tıkla!");
  </script>
</body>
</html>
